<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JioSaavn API Test</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: sans-serif; }
    body { background-color: #121212; color: #fff; padding: 20px; display: flex; justify-content: center; }
    .container { width: 100%; max-width: 500px; background: #1e1e1e; padding: 20px; border-radius: 10px; }
    h1 { color: #1db954; font-size: 1.3rem; margin-bottom: 15px; text-align: center; }
    .search-box { display: flex; gap: 8px; margin-bottom: 15px; }
    input { flex: 1; padding: 10px; border-radius: 5px; border: 1px solid #333; background: #2a2a2a; color: #fff; }
    button { padding: 10px 15px; border-radius: 5px; border: none; background: #1db954; color: #000; font-weight: bold; cursor: pointer; }
    .status { text-align: center; color: #aaa; font-size: 0.85rem; margin-bottom: 15px; word-break: break-all; }
    .current-song { background: #282828; padding: 12px; border-radius: 6px; margin-bottom: 15px; }
    audio { width: 100%; margin-top: 10px; }
    .reco-card { background: #222; padding: 10px; border-radius: 5px; margin-bottom: 8px; display: flex; align-items: center; justify-content: space-between; cursor: pointer; }
    .reco-card img { width: 40px; height: 40px; border-radius: 4px; margin-right: 10px; }
    .reco-info { flex: 1; overflow: hidden; }
    .reco-title { font-size: 0.85rem; font-weight: bold; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <div class="container">
    <h1>🎵 JioSaavn Recommendations Test</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Enter song name (e.g. Hukum)" value="Hukum">
      <button onclick="testRecommendations()">Search</button>
    </div>

    <div id="status" class="status">Ready to search...</div>

    <div id="playerContainer" style="display: none;">
      <div class="current-song">
        <h3 id="currentTitle">--</h3>
        <p id="currentArtist" style="color: #aaa; font-size: 0.8rem;">--</p>
        <audio id="audioPlayer" controls></audio>
      </div>
      <h3 style="margin-bottom: 10px; font-size: 1rem;">Suggestions:</h3>
      <div id="recoList"></div>
    </div>
  </div>

  <script>
    // List of target base endpoints to test
    const CANDIDATE_BASES = [
      "https://mu-zeta-orpin.vercel.app/api",
      "https://mu-zeta-orpin.vercel.app",
      "https://saavn.dev/api",
      "https://saavn.me/api"
    ];

    async function fetchFromApi(path) {
      const statusEl = document.getElementById("status");
      
      for (const base of CANDIDATE_BASES) {
        const fullUrl = `${base}${path}`;
        try {
          console.log(`Testing URL: ${fullUrl}`);
          const res = await fetch(fullUrl);
          
          if (res.ok) {
            const data = await res.json();
            if (data && (data.status === 'SUCCESS' || data.data)) {
              console.log(`Connected successfully to: ${fullUrl}`);
              return data;
            }
          } else {
            console.warn(`URL ${fullUrl} responded with status: ${res.status}`);
          }
        } catch (err) {
          console.error(`Failed to fetch from ${fullUrl}:`, err.message);
        }
      }
      throw new Error("All endpoints failed or were blocked by CORS.");
    }

    async function testRecommendations() {
      const query = document.getElementById("searchInput").value.trim();
      const status = document.getElementById("status");
      const playerContainer = document.getElementById("playerContainer");

      if (!query) return;

      status.innerText = "Connecting to API...";
      playerContainer.style.display = "none";

      try {
        const searchData = await fetchFromApi(`/search/songs?query=${encodeURIComponent(query)}&limit=1`);

        if (!searchData.data || !searchData.data.results || searchData.data.results.length === 0) {
          status.innerText = "No results found.";
          return;
        }

        const song = searchData.data.results[0];
        displaySong(song);

        status.innerText = "Fetching suggestions...";
        const recoData = await fetchFromApi(`/songs/${song.id}/suggestions`);
        displayRecommendations(recoData.data || []);

        status.innerText = `Loaded ${recoData.data ? recoData.data.length : 0} suggestions!`;
        playerContainer.style.display = "block";

      } catch (err) {
        status.innerText = "Connection failed! Open this file directly in Chrome browser to bypass previewer CORS blocks.";
      }
    }

    function displaySong(song) {
      document.getElementById("currentTitle").innerText = song.name || "Unknown";
      document.getElementById("currentArtist").innerText = song.primaryArtists || song.artist || "Unknown Artist";
      
      const audio = document.getElementById("audioPlayer");
      const streamUrl = Array.isArray(song.downloadUrl) ? song.downloadUrl[song.downloadUrl.length - 1]?.url : song.downloadUrl;
      audio.src = streamUrl || "";
      audio.play().catch(() => {});
    }

    function displayRecommendations(songs) {
      const list = document.getElementById("recoList");
      list.innerHTML = "";

      songs.forEach(song => {
        const img = Array.isArray(song.image) ? song.image[song.image.length - 1]?.url : song.image;
        const card = document.createElement("div");
        card.className = "reco-card";
        card.innerHTML = `
          <img src="${img || ''}" alt="">
          <div class="reco-info">
            <div class="reco-title">${song.name}</div>
          </div>
        `;
        card.onclick = () => displaySong(song);
        list.appendChild(card);
      });
    }
  </script>
</body>
</html>
