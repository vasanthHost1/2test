<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>JioSaavn Recommendations Player</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
    body { background-color: #121212; color: #ffffff; padding: 16px; display: flex; justify-content: center; }
    .app-container { width: 100%; max-width: 480px; background: #181818; padding: 20px; border-radius: 12px; box-shadow: 0 10px 30px rgba(0,0,0,0.5); }
    
    h1 { font-size: 1.3rem; color: #1db954; margin-bottom: 16px; text-align: center; font-weight: 700; }
    
    .search-box { display: flex; gap: 8px; margin-bottom: 16px; }
    input { flex: 1; padding: 12px; border-radius: 6px; border: 1px solid #333; background: #282828; color: #fff; font-size: 0.95rem; outline: none; }
    input:focus { border-color: #1db954; }
    button { padding: 12px 18px; border: none; border-radius: 6px; background: #1db954; color: #000; font-weight: 700; cursor: pointer; }

    .status { text-align: center; color: #b3b3b3; font-size: 0.85rem; margin-bottom: 16px; word-break: break-all; padding: 8px; background: #222; border-radius: 6px; }

    .player-card { background: #282828; padding: 16px; border-radius: 8px; margin-bottom: 20px; display: flex; flex-direction: column; align-items: center; border: 1px solid #333; }
    .player-card img { width: 140px; height: 140px; border-radius: 8px; object-fit: cover; margin-bottom: 12px; background: #333; }
    .song-title { font-size: 1.1rem; font-weight: bold; text-align: center; margin-bottom: 4px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .song-artist { font-size: 0.85rem; color: #b3b3b3; text-align: center; margin-bottom: 12px; width: 100%; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    audio { width: 100%; height: 40px; outline: none; }

    h2 { font-size: 1rem; color: #b3b3b3; margin-bottom: 10px; text-transform: uppercase; letter-spacing: 0.5px; }
    .reco-list { display: flex; flex-direction: column; gap: 8px; max-height: 320px; overflow-y: auto; }
    .reco-card { background: #222; padding: 10px; border-radius: 6px; display: flex; align-items: center; gap: 12px; cursor: pointer; }
    .reco-card:hover { background: #333; }
    .reco-card img { width: 44px; height: 44px; border-radius: 4px; object-fit: cover; background: #333; flex-shrink: 0; }
    .reco-info { flex: 1; overflow: hidden; }
    .reco-title { font-size: 0.9rem; font-weight: 600; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
    .reco-artist { font-size: 0.78rem; color: #888; white-space: nowrap; overflow: hidden; text-overflow: ellipsis; }
  </style>
</head>
<body>

  <div class="app-container">
    <h1>🎵 JioSaavn Music Player</h1>

    <div class="search-box">
      <input type="text" id="searchInput" placeholder="Search song or movie..." value="Hukum" onkeypress="if(event.key==='Enter') startSearch()">
      <button onclick="startSearch()">Search</button>
    </div>

    <div id="status" class="status">Click Search to test live API</div>

    <div id="playerSection" style="display: none;">
      <div class="player-card">
        <img id="coverImg" src="" alt="Album Cover">
        <div id="songTitle" class="song-title">--</div>
        <div id="songArtist" class="song-artist">--</div>
        <audio id="audioPlayer" controls></audio>
      </div>

      <h2>Up Next (Recommendations)</h2>
      <div id="recoList" class="reco-list"></div>
    </div>
  </div>

  <script>
    // Live API Mirrored Servers
    const MIRRORS = [
      "https://saavn.dev/api",
      "https://saavn.me/api",
      "https://jiosaavn-api-sigma.vercel.app/api"
    ];

    async function fetchFromApi(path) {
      const status = document.getElementById("status");

      for (const base of MIRRORS) {
        const fullUrl = `${base}${path}`;
        try {
          console.log(`Trying endpoint: ${fullUrl}`);
          const res = await fetch(fullUrl);
          
          if (res.ok) {
            const data = await res.json();
            if (data && (data.status === 'SUCCESS' || data.data)) {
              return data;
            }
          }
        } catch (e) {
          console.warn(`Endpoint ${base} failed, trying next...`);
        }
      }
      throw new Error("Unable to reach JioSaavn servers right now.");
    }

    async function startSearch() {
      const query = document.getElementById("searchInput").value.trim();
      const status = document.getElementById("status");
      const playerSection = document.getElementById("playerSection");

      if (!query) return;

      status.innerText = "Searching JioSaavn...";
      playerSection.style.display = "none";

      try {
        const searchResult = await fetchFromApi(`/search/songs?query=${encodeURIComponent(query)}&limit=1`);

        if (!searchResult.data || !searchResult.data.results || searchResult.data.results.length === 0) {
          status.innerText = "No matching songs found.";
          return;
        }

        const primarySong = searchResult.data.results[0];
        playSong(primarySong);

        status.innerText = "Fetching recommendations...";
        const suggestionsResult = await fetchFromApi(`/songs/${primarySong.id}/suggestions`);
        
        const recommendations = suggestionsResult.data || [];
        renderRecommendations(recommendations);

        status.innerText = `Playing "${primarySong.name}" (${recommendations.length} recommendations loaded)`;
        playerSection.style.display = "block";

      } catch (err) {
        console.error(err);
        status.innerText = "Error connecting to JioSaavn API mirrors.";
      }
    }

    function parseArtistName(song) {
      if (song.artists?.primary && Array.isArray(song.artists.primary) && song.artists.primary.length > 0) {
        return song.artists.primary.map(a => a.name).join(", ");
      }
      return song.primaryArtists || song.artist || "Unknown Artist";
    }

    function parseImage(song) {
      if (Array.isArray(song.image) && song.image.length > 0) {
        return song.image[song.image.length - 1]?.url || song.image[0]?.url;
      }
      return song.image || "";
    }

    function parseAudioUrl(song) {
      if (Array.isArray(song.downloadUrl) && song.downloadUrl.length > 0) {
        const highQuality = song.downloadUrl.find(item => item.quality === '320kbps');
        return highQuality?.url || song.downloadUrl[song.downloadUrl.length - 1]?.url;
      }
      return song.downloadUrl || "";
    }

    function playSong(song) {
      document.getElementById("songTitle").innerText = song.name || "Unknown Track";
      document.getElementById("songArtist").innerText = parseArtistName(song);
      document.getElementById("coverImg").src = parseImage(song);

      const audio = document.getElementById("audioPlayer");
      audio.src = parseAudioUrl(song);
      audio.play().catch(() => {});
    }

    function renderRecommendations(songs) {
      const container = document.getElementById("recoList");
      container.innerHTML = "";

      if (!songs || songs.length === 0) {
        container.innerHTML = "<p style='color:#777; text-align:center;'>No recommendations available.</p>";
        return;
      }

      songs.forEach(song => {
        const card = document.createElement("div");
        card.className = "reco-card";
        card.innerHTML = `
          <img src="${parseImage(song)}" alt="Cover">
          <div class="reco-info">
            <div class="reco-title">${song.name}</div>
            <div class="reco-artist">${parseArtistName(song)}</div>
          </div>
        `;

        card.onclick = () => {
          playSong(song);
          loadNextQueue(song.id);
        };

        container.appendChild(card);
      });
    }

    async function loadNextQueue(songId) {
      const status = document.getElementById("status");
      status.innerText = "Updating queue recommendations...";
      try {
        const res = await fetchFromApi(`/songs/${songId}/suggestions`);
        renderRecommendations(res.data || []);
        status.innerText = "Queue updated";
      } catch (e) {
        console.error("Queue update failed:", e);
      }
    }
  </script>
</body>
</html>
